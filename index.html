<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>roomshare</title>

  <link rel="icon" href="icon.svg?v=a10023" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json?v=b1233b" />
  <meta name="theme-color" content="#166f16" />

  <link rel="stylesheet" href="css/fonts.css?v=a9621f" />
  <link rel="stylesheet" href="css/theme.css?v=5f8242" />
  <link rel="stylesheet" href="css/layout.css?v=cff63b" />
  <link rel="stylesheet" href="css/stage.css?v=44126a" />
  <link rel="stylesheet" href="css/controls-panel.css?v=81a0c5" />
  <link rel="stylesheet" href="css/buttons.css?v=8e274e" />
  <link rel="stylesheet" href="css/spinner.css?v=7fa638" />
  <link rel="stylesheet" href="css/video-tile.css?v=e4f071" />
  <link rel="stylesheet" href="css/modal.css?v=5616f8" />
  <link rel="stylesheet" href="css/toast.css?v=5065bd" />
</head>
<body>

<main class="stage is-empty" data-role="stage">
  <video class="stage-video" data-role="stage-video" autoplay muted playsinline style="display:none;"></video>
  <div class="video-tile-label" data-role="stage-label" style="display:none;"></div>

  <div class="stage-empty" data-role="stage-empty">
    <div class="image-page-spinner" data-role="connecting-spinner"></div>
    <p class="status-text" data-role="status"></p>
  </div>

  <div class="toast is-hidden" data-role="toast"></div>

  <div class="stage-overlay" data-role="stage-overlay">
    <div class="film-strip panel-surface" data-role="film-strip"></div>
    <div class="thumbnail-rail panel-surface" data-role="thumbnail-rail"></div>
    <div class="controls-panel panel-surface" data-role="controls-panel">
      <button class="btn btn-confirm" data-role="share-button"></button>
      <button class="btn" data-role="copy-link-button"></button>
      <button class="btn" data-role="fullscreen-button"></button>
      <button class="btn" data-role="zoom-button"></button>
      <button class="btn btn-confirm is-hidden" data-role="paint-button"></button>
      <button class="btn is-hidden" data-role="screenshot-button"></button>
      <button class="btn" data-role="info-button"></button>
      <div class="member-widget" data-role="member-widget">
        <div class="member-widget-count" data-role="member-widget-count"></div>
        <div class="member-widget-status" data-role="member-widget-status"></div>
      </div>
    </div>
  </div>

  <div class="lightbox is-hidden" data-role="lightbox">
    <img class="lightbox-image" data-role="lightbox-image" alt="" />
  </div>

  <div class="modal-backdrop is-hidden" data-role="info-modal-backdrop">
    <div class="modal" data-role="info-modal">
      <div class="modal-header">
        <h2 class="modal-title" data-role="info-modal-title"></h2>
        <div class="modal-header-actions">
          <button class="btn" data-role="info-copy-button"></button>
          <button class="btn modal-close" data-role="info-modal-close">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="info-members" data-role="info-members"></div>
        <div data-role="info-modal-body"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop is-hidden" data-role="name-modal-backdrop">
    <form class="modal name-modal" data-role="name-form" novalidate>
      <div class="modal-header">
        <h2 class="modal-title" data-role="name-modal-title"></h2>
        <button type="button" class="btn modal-close is-hidden" data-role="name-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <p class="name-hint" data-role="name-hint"></p>
        <input class="field" data-role="name-input" type="text" autocomplete="nickname" spellcheck="false" />
        <p class="name-error" data-role="name-error" aria-live="polite"></p>
        <div class="name-actions">
          <button type="submit" class="btn btn-confirm" data-role="name-submit"></button>
        </div>
      </div>
    </form>
  </div>
</main>

<script src="js/roomws.js?v=eb1bc1"></script>
<script type="module" src="js/app.js?v=ca4cc6"></script>
</body>
</html>
